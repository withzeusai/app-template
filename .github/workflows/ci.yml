name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, managed-v1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/template-variants/managed-v1/pnpm-lock.yaml

      - name: Test template materialization
        if: matrix.variant == 'legacy'
        run: node --test .github/scripts/materialize-template-variants.test.mjs

      - name: Materialize template variants
        run: |
          node .github/scripts/materialize-template-variants.mjs \
            --output-dir /tmp/app-template-variants

      - name: Install dependencies
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm lint

      - name: Format check
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm prettier-check

      - name: Type check & build
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm build

      - name: Type check Convex
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm exec tsc -p convex/tsconfig.json

      - name: Test
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm test

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
