name: Package and Upload to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Materialize template variants
        run: |
          node .github/scripts/materialize-template-variants.mjs \
            --output-dir /tmp/app-template-variants

      - name: Create tarball
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Sanitize ref name for use as a filename (e.g., feature/abc -> feature-abc).
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"
          LEGACY_TARBALL_PATH="/tmp/${SAFE_BRANCH_NAME}.tar.gz"

          tar -C /tmp/app-template-variants/legacy \
            -czf "${LEGACY_TARBALL_PATH}" .

          echo "SAFE_BRANCH_NAME=${SAFE_BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "LEGACY_TARBALL_PATH=${LEGACY_TARBALL_PATH}" >> "$GITHUB_ENV"
          echo "Created legacy tarball from branch: ${BRANCH_NAME}"
          ls -lh "${LEGACY_TARBALL_PATH}"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          R2_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Preserve the existing legacy URL.
          aws s3 cp "${LEGACY_TARBALL_PATH}" \
            "s3://hercules-app-templates/${SAFE_BRANCH_NAME}.tar.gz" \
            --endpoint-url "${R2_URL}"

          # Immutable paths let herculesd pin a template release for warm pools.
          aws s3 cp "${LEGACY_TARBALL_PATH}" \
            "s3://hercules-app-templates/releases/${GITHUB_SHA}/legacy.tar.gz" \
            --endpoint-url "${R2_URL}"

          echo "Successfully uploaded the legacy template"

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/app-template-variants
          rm -f "${LEGACY_TARBALL_PATH}"
          echo "Cleaned up template artifacts"
