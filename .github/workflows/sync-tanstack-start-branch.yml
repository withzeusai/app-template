name: Sync migrate/tanstack-start

# Temporary. Hercules still scaffolds TanStack Start apps by cloning the root
# of the migrate/tanstack-start branch. Until it reads tanstack-start/ from
# main instead, each push to main commits tanstack-start/ onto that branch, so
# main is the only place the template is edited. Delete this workflow, and the
# branch, once Hercules no longer clones it.

on:
  push:
    branches: [main]
    paths:
      - "tanstack-start/**"
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace the branch even though it has commits main lacks. Only after porting them to tanstack-start/ on main.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-tanstack-start-branch
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit tanstack-start/ onto migrate/tanstack-start
        env:
          BRANCH: migrate/tanstack-start
          GITHUB_TOKEN: ${{ github.token }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags "${REMOTE}" "refs/heads/${BRANCH}"
          parent="$(git rev-parse FETCH_HEAD)"
          tree="$(git rev-parse "HEAD:tanstack-start")"

          if [ "$(git rev-parse "${parent}^{tree}")" = "${tree}" ]; then
            echo "${BRANCH} already matches tanstack-start/"
            exit 0
          fi

          # Replace the branch only when it holds nothing main lacks: its tip
          # is already in main's history, or it is an earlier sync nobody has
          # pushed on top of. Otherwise a change merged into the branch would
          # be reverted for every new TanStack Start app.
          synced_from="$(git log -1 --format=%B "${parent}" | sed -n 's/^Sync tanstack-start\/ from main@\([0-9a-f]\{40\}\)$/\1/p')"
          if git merge-base --is-ancestor "${parent}" HEAD; then
            :
          elif [ -n "${synced_from}" ] &&
            [ "$(git rev-parse "${parent}^{tree}")" = "$(git rev-parse "${synced_from}:tanstack-start")" ]; then
            :
          elif [ "${OVERWRITE}" = "true" ]; then
            echo "Replacing ${BRANCH} although it has commits main lacks, as requested"
          else
            # Sync commits are not in main's history, so merging the branch
            # back would conflict with every synced change. Port each commit
            # on its own instead.
            echo "::error::${BRANCH} has commits that are not on main. Port each one to tanstack-start/ on main (git cherry-pick -Xsubtree=tanstack-start <commit>), then run this workflow by hand with overwrite."
            exit 1
          fi

          # The branch gets main's tanstack-start/ as its whole tree, on top of
          # its current tip, so the push is a fast-forward.
          commit="$(
            GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit-tree "${tree}" -p "${parent}" \
              -m "Sync tanstack-start/ from main@${GITHUB_SHA}"
          )"
          git push "${REMOTE}" "${commit}:refs/heads/${BRANCH}"
          echo "Pushed ${commit} to ${BRANCH}"
