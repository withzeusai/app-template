name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, managed-v1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/template-variants/managed-v1/pnpm-lock.yaml

      - name: Test template materialization
        if: matrix.variant == 'legacy'
        run: node --test .github/scripts/materialize-template-variants.test.mjs

      - name: Materialize template variants
        run: |
          node .github/scripts/materialize-template-variants.mjs \
            --output-dir /tmp/app-template-variants

      - name: Install dependencies
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm lint

      - name: Format check
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm prettier-check

      - name: Type check & build
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm build

      - name: Type check Convex
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm exec tsc -p convex/tsconfig.json

      - name: Test
        working-directory: /tmp/app-template-variants/${{ matrix.variant }}
        run: pnpm test

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
