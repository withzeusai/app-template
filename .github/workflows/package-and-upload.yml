name: Package and Upload to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Create tarball
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Sanitize ref name for use as a filename (e.g., feature/abc -> feature-abc).
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"
          TARBALL_NAME="${SAFE_BRANCH_NAME}.tar.gz"
          TARBALL_PATH="/tmp/${TARBALL_NAME}"

          # Create tarball in /tmp to avoid "file changed as we read it" error.
          tar -czf "${TARBALL_PATH}" \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.local' \
            .

          echo "TARBALL_PATH=${TARBALL_PATH}" >> "$GITHUB_ENV"
          echo "Created tarball: ${TARBALL_NAME} from branch: ${BRANCH_NAME}"
          ls -lh "${TARBALL_PATH}"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          TARBALL_NAME="$(basename "${TARBALL_PATH}")"

          aws s3 cp "${TARBALL_PATH}" \
            "s3://hercules-app-templates/${TARBALL_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Successfully uploaded ${TARBALL_NAME} to R2 bucket: hercules-app-templates"

      - name: Cleanup
        if: always()
        run: |
          rm -f "${TARBALL_PATH}"
          echo "Cleaned up tarball"
