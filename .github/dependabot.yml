version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # 7-day cooldown so freshly published versions sit out the typical window
    # for npm supply-chain attacks before Dependabot proposes them. This is
    # stricter than the 3-day `minimumReleaseAge` in pnpm-workspace.yaml,
    # which governs ad-hoc installs. First-party `@usehercules/*` packages
    # are excluded to mirror the pnpm `minimumReleaseAgeExclude` list.
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
      include:
        - "*"
      exclude:
        - "@usehercules/*"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
