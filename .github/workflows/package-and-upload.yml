name: Package and Upload to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Materialize template variants
        run: |
          node .github/scripts/materialize-template-variants.mjs \
            --output-dir /tmp/app-template-variants

      - name: Create tarballs
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Sanitize ref name for use as a filename (e.g., feature/abc -> feature-abc).
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"

          # One tarball per materialized <template>/<variant>.
          for dir in /tmp/app-template-variants/*/*/; do
            variant="$(basename "${dir}")"
            template="$(basename "$(dirname "${dir}")")"
            mkdir -p "/tmp/app-template-tarballs/${template}"
            tar -C "${dir}" -czf "/tmp/app-template-tarballs/${template}/${variant}.tar.gz" .
          done

          echo "SAFE_BRANCH_NAME=${SAFE_BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "Created tarballs from branch: ${BRANCH_NAME}"
          ls -lhR /tmp/app-template-tarballs

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          R2_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload() {
            aws s3 cp "/tmp/app-template-tarballs/$1.tar.gz" \
              "s3://hercules-app-templates/$2" \
              --endpoint-url "${R2_URL}"
          }

          for tarball in /tmp/app-template-tarballs/*/*.tar.gz; do
            variant="$(basename "${tarball}" .tar.gz)"
            template="$(basename "$(dirname "${tarball}")")"

            # <template>/main.tar.gz, and <template>/<variant>/main.tar.gz for
            # the variants built on top of it.
            if [ "${variant}" = "legacy" ]; then
              upload "${template}/${variant}" "${template}/${SAFE_BRANCH_NAME}.tar.gz"
            else
              upload "${template}/${variant}" "${template}/${variant}/${SAFE_BRANCH_NAME}.tar.gz"
            fi

            # Immutable paths let herculesd pin a template release for warm pools.
            upload "${template}/${variant}" "releases/${GITHUB_SHA}/${template}/${variant}.tar.gz"
          done

          # The paths herculesd reads today, from before the repository held
          # more than one template. They stay the react-spa template.
          upload react-spa/legacy "${SAFE_BRANCH_NAME}.tar.gz"
          upload react-spa/managed-v1 "managed-v1/${SAFE_BRANCH_NAME}.tar.gz"
          upload react-spa/legacy "releases/${GITHUB_SHA}/legacy.tar.gz"
          upload react-spa/managed-v1 "releases/${GITHUB_SHA}/managed-v1.tar.gz"

          echo "Successfully uploaded every template variant"

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/app-template-variants /tmp/app-template-tarballs
          echo "Cleaned up template artifacts"
