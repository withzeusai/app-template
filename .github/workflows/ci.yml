name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test template materialization
        run: node --test .github/scripts/materialize-templates.test.mjs

  check:
    name: check (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [react-spa, tanstack-start]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.template }}/pnpm-lock.yaml

      - name: Materialize templates
        run: |
          node .github/scripts/materialize-templates.mjs \
            --output-dir /tmp/app-templates

      - name: Install dependencies
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm install --frozen-lockfile

      # The route tree is committed. Regenerate it and fail if it changed, so
      # a route change cannot land with a stale tree. `tsr.config.json` repeats
      # the footer TanStack Start adds, so this matches what `vite dev` writes.
      - name: Generate routes
        if: matrix.template == 'tanstack-start'
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: |
          cp src/routeTree.gen.ts "$RUNNER_TEMP/routeTree.gen.ts"
          pnpm generate-routes
          diff -u "$RUNNER_TEMP/routeTree.gen.ts" src/routeTree.gen.ts

      - name: Lint
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm lint

      - name: Format check
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm prettier-check

      # react-spa type checks as part of its build (`tsc -b && vite build`).
      - name: Type check
        if: matrix.template == 'tanstack-start'
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm build

      - name: Type check Convex
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm exec tsc -p convex/tsconfig.json

      - name: Test
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm test

      # Lint, type check, and build pass even when every page with a loader
      # crashes during server rendering (for example when two TanStack
      # packages in the lockfile no longer agree). Serve a production build
      # and request real pages, including a loader that fills TanStack Query,
      # so such a crash fails here. Needs no Convex backend. Rebuilds with a
      # temporary route, so it runs after the steps that use the plain build.
      - name: SSR smoke test
        if: matrix.template == 'tanstack-start'
        run: |
          node .github/scripts/ssr-smoke-test.mjs \
            --app-dir /tmp/app-templates/${{ matrix.template }}

      # The app builder adds packages with `pnpm add`, which re-checks every
      # locked package against `minimumReleaseAge`. A lockfile that pins a
      # release younger than that makes every package install fail in new
      # apps, so add an old package the same way. Runs last: it edits the
      # materialized copy.
      - name: Check packages can be added
        working-directory: /tmp/app-templates/${{ matrix.template }}
        run: pnpm add ms@2.1.3

  # The checks above pass when signed-in pages break only in a browser talking
  # to Convex, such as queries reaching Convex before the session's token.
  # Serve tanstack-start's production build against a real local Convex
  # backend and a mock Hercules Auth, and drive it with Playwright.
  e2e:
    name: e2e (tanstack-start)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tanstack-start/pnpm-lock.yaml
            .github/e2e/pnpm-lock.yaml

      - name: Materialize templates
        run: |
          node .github/scripts/materialize-templates.mjs \
            --output-dir /tmp/app-templates

      - name: Install template dependencies
        working-directory: /tmp/app-templates/tanstack-start
        run: pnpm install --frozen-lockfile

      - name: Install test dependencies
        working-directory: .github/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Test
        run: |
          node .github/e2e/run.mjs \
            --app-dir /tmp/app-templates/tanstack-start

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
