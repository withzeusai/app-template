name: Package and Upload to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize templates
        run: |
          node .github/scripts/materialize-templates.mjs \
            --output-dir /tmp/app-templates

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # What dev machines run (PNPM_VERSION in hercules.app's
          # docker/dev-image.dockerfile). The cache records each dependency's
          # path under node_modules/.pnpm, whose names depend on the version.
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Ship tanstack-start with Vite's dependency cache, so a new app's first
      # dev server start reuses it instead of bundling the dependencies. Vite
      # hashes the app's absolute path, so the cache is built where dev
      # machines keep the app. If it cannot be built or a fresh app would not
      # reuse it, the tarball ships without it, as before.
      - name: Warm the Vite dependency cache
        run: |
          sudo mkdir -p /home/dev-user/app
          sudo chown -R "$(id -u):$(id -g)" /home/dev-user
          node .github/scripts/warm-vite-cache.mjs \
            --template-dir /tmp/app-templates/tanstack-start \
            --app-dir /home/dev-user/app \
            --environments client,ssr \
            --best-effort

      - name: Create tarballs
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Sanitize ref name for use as a filename (e.g., feature/abc -> feature-abc).
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"

          # One tarball per materialized template.
          mkdir -p /tmp/app-template-tarballs
          for dir in /tmp/app-templates/*/; do
            template="$(basename "${dir}")"
            tar -C "${dir}" -czf "/tmp/app-template-tarballs/${template}.tar.gz" .
          done

          echo "SAFE_BRANCH_NAME=${SAFE_BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "Created tarballs from branch: ${BRANCH_NAME}"
          ls -lh /tmp/app-template-tarballs

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          R2_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload() {
            aws s3 cp "/tmp/app-template-tarballs/$1.tar.gz" \
              "s3://hercules-app-templates/$2" \
              --endpoint-url "${R2_URL}"
          }

          for tarball in /tmp/app-template-tarballs/*.tar.gz; do
            template="$(basename "${tarball}" .tar.gz)"
            upload "${template}" "${template}/${SAFE_BRANCH_NAME}.tar.gz"
            # Immutable paths let herculesd pin a template release for warm pools.
            upload "${template}" "releases/${GITHUB_SHA}/${template}.tar.gz"
          done

          # The paths from before the repository held more than one template
          # (herculesd reads main.tar.gz). They stay the react-spa template.
          upload react-spa "${SAFE_BRANCH_NAME}.tar.gz"
          upload react-spa "releases/${GITHUB_SHA}/legacy.tar.gz"

          echo "Successfully uploaded every template"

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/app-templates /tmp/app-template-tarballs
          echo "Cleaned up template artifacts"
